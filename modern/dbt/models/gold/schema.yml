version: 2

models:
  - name: gold_card_settlement_reconciliation
    description: >-
      Grain: one row per batch and currency, matching the legacy paid grain
      so golden-match compares like with like.
    columns:
      - name: batch_id
        tests: [not_null]
      - name: currency
        tests:
          - not_null
          - accepted_values:
              values: ["BRL"]
      - name: status
        tests:
          - not_null
          - accepted_values:
              values: ["MATCHED", "MISMATCHED"]
